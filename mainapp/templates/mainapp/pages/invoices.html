{% extends 'wrapper.html' %}
{% load mainapp_tags %}
{% block body %}
    <style>
        .update-info {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #dee2e6;
        }
        .update-info small {
            color: #6c757d;
            font-size: 0.875em;
        }
        .update-info div {
            font-weight: 500;
            margin-top: 2px;
        }
    </style>

    <div class="mb-3 d-flex justify-content-between align-items-start">
        <div>
            <!-- Ліва частина залишається порожньою, оскільки пошук тепер в компоненті -->
        </div>
        
        <div class="text-end update-info">
            <!-- Права частина - інформація про оновлення -->
            <div class="mb-2">
                <small class="text-muted">Последнее обновление:</small>
                <div><span id="lastUpdate">{{ invoices_last_update_at|date:"d.m.Y, H:i:s" }}</span></div>
            </div>
            <div>
                <small class="text-muted">Следующее обновление через:</small>
                <div><span id="countdown"></span></div>
            </div>
        </div>
    </div>

    {% include "mainapp/parts/dreamkas_invoices_display.html" %}

    <script>
        // Add new countdown functionality
        function updateCountdown() {
            $.ajax({
                url: '{% url "get_invoice_timers" %}',
                method: 'GET',
                success: function(response) {
                    if (response.invoices_being_updated) {
                        if ($('#countdown').length) {
                            $('#countdown').text('Обновление...');
                        }
                        return;
                    }
                    
                    // Оновлюємо відображення останнього оновлення
                    if (response.invoices_last_update_at && $('#lastUpdate').length) {
                        $('#lastUpdate').text(response.invoices_last_update_at);
                    }
                    
                    // Обчислюємо час до наступного оновлення
                    if (response.invoices_next_update_at && $('#countdown').length) {
                        try {
                            // Конвертуємо формат дати з "dd.mm.yyyy, hh:mm:ss" в ISO формат
                            const dateStr = response.invoices_next_update_at;
                            const match = dateStr.match(/(\d{2})\.(\d{2})\.(\d{4}), (\d{2}):(\d{2}):(\d{2})/);
                            if (match) {
                                const [, day, month, year, hour, minute, second] = match;
                                const isoDate = `${year}-${month}-${day}T${hour}:${minute}:${second}`;
                                const nextUpdate = new Date(isoDate);
                                const now = new Date();
                                let timeLeft = nextUpdate - now;
                                
                                if (timeLeft <= 0) {
                                    $('#countdown').text('Обновление...');
                                } else {
                                    const minutes = Math.floor(timeLeft / 60000);
                                    const seconds = Math.floor((timeLeft % 60000) / 1000);
                                    $('#countdown').text(`${minutes}:${seconds.toString().padStart(2, '0')}`);
                                }
                            }
                        } catch (error) {
                            console.error('Error parsing date:', error);
                            $('#countdown').text('Ошибка');
                        }
                    }
                },
                error: function(xhr, status, error) {
                    console.error('Error fetching timer data:', error);
                    if ($('#countdown').length) {
                        $('#countdown').text('Ошибка');
                    }
                }
            });
        }

        setInterval(updateCountdown, 20000);
        updateCountdown(); // Initial call
    </script>
{% endblock %}
