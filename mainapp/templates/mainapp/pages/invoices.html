{% extends 'wrapper.html' %}
{% load mainapp_tags %}
{% block body %}
    <style>
        .update-info {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #dee2e6;
            position: absolute;
            top: -5px;
            right: 20px;
            z-index: 1000;
            min-width: 200px;
        }
        .settings-info {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #dee2e6;
            position: absolute;
            top: -5px;
            right: 240px;
            z-index: 1000;
            min-width: 600px;
        }
        .settings-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .settings-field {
            display: flex;
            flex-direction: column;
            min-width: 120px;
        }
        .settings-field label {
            font-size: 0.75em;
            margin-bottom: 2px;
            color: #6c757d;
        }
        .settings-field input {
            font-size: 0.875rem;
            padding: 0.25rem 0.5rem;
            width: 80px;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
        }
        .settings-button {
            margin-left: auto;
        }
        .update-info small,
        .settings-info small {
            color: #6c757d;
            font-size: 0.875em;
        }
        .update-info div,
        .settings-info div {
            font-weight: 500;
            margin-top: 2px;
        }
        .content-wrapper {
            position: relative;
        }
        .form-control-sm {
            font-size: 0.875rem;
            padding: 0.25rem 0.5rem;
        }
        .form-label {
            margin-bottom: 0.25rem;
        }
        .border-top {
            border-top: 1px solid #dee2e6 !important;
        }
    </style>

    <div class="content-wrapper">
        <!-- Налаштування кількості документів (зліва) -->
        <div class="settings-info">
            <div class="settings-row">
                <div class="settings-field">
                    <label for="invoices_num">Количество накладных:</label>
                    <input type="number" id="invoices_num" value="10">
                </div>
                <div class="settings-field">
                    <label for="pricing_num">Количество Расценок:</label>
                    <input type="number" id="pricing_num" value="20">
                </div>
                <div class="settings-field">
                    <label for="correction_invoices_num">Количество корректировок:</label>
                    <input type="number" id="correction_invoices_num" value="5">
                </div>
                <div class="settings-button">
                    <button type="button" id="saveSettings" class="btn btn-primary btn-sm">Сохранить</button>
                </div>
            </div>
        </div>
        
        <!-- Інформація про оновлення (справа) -->
        <div class="text-end update-info">
            <div class="mb-2">
                <small class="text-muted">Последнее обновление:</small>
                <div><span id="lastUpdate">{{ invoices_last_update_at|date:"d.m.Y, H:i:s" }}</span></div>
            </div>
            <div>
                <small class="text-muted">Следующее обновление через:</small>
                <div><span id="countdown"></span></div>
            </div>
        </div>
    </div>
    <div>
        {% include "mainapp/parts/dreamkas_invoices_display.html" %}
    </div>

    <script>
        // Add new countdown functionality
        function updateCountdown() {
            $.ajax({
                url: '{% url "get_invoice_timers" %}',
                method: 'GET',
                success: function(response) {
                    console.log(response.invoices_being_updated)
                    if (response.invoices_being_updated == true) {
                        $('#countdown').text('Обновление...');
                    } else {
                        $('#countdown').text(response.invoices_next_update_at);
                    }
                    
                    // Оновлюємо відображення останнього оновлення
                    if (response.invoices_last_update_at && $('#lastUpdate').length) {
                        $('#lastUpdate').text(response.invoices_last_update_at);
                    }
                },
                error: function(xhr, status, error) {
                    console.error('Error fetching timer data:', error);
                    if ($('#countdown').length) {
                        $('#countdown').text('Ошибка');
                    }
                }
            });
        }

        setInterval(updateCountdown, 20000);
        updateCountdown(); // Initial call
        
        // Завантаження поточних значень налаштувань
        function loadSettings() {
            $.ajax({
                url: '{% url "get_invoice_timers" %}',
                method: 'GET',
                success: function(response) {
                    if (response.invoices_num) {
                        $('#invoices_num').val(response.invoices_num);
                    }
                    if (response.pricing_num) {
                        $('#pricing_num').val(response.pricing_num);
                    }
                    if (response.correction_invoices_num) {
                        $('#correction_invoices_num').val(response.correction_invoices_num);
                    }
                },
                error: function(xhr, status, error) {
                    console.error('Error loading settings:', error);
                }
            });
        }
        
        // Обробка збереження налаштувань
        $('#saveSettings').click(function() {
            const invoices_num = $('#invoices_num').val();
            const pricing_num = $('#pricing_num').val();
            const correction_invoices_num = $('#correction_invoices_num').val();
            
            $.ajax({
                url: '{% url "set_invoice_update_amount" %}',
                method: 'POST',
                data: {
                    invoices_num: invoices_num,
                    pricing_num: pricing_num,
                    correction_invoices_num: correction_invoices_num,
                    csrfmiddlewaretoken: '{{ csrf_token }}'
                },
                success: function(response) {
                    if (response.success) {
                        alert('Настройки успешно сохранены!');
                    } else {
                        alert('Ошибка при сохранении настроек: ' + (response.error || 'Неизвестная ошибка'));
                    }
                },
                error: function(xhr, status, error) {
                    console.error('Error saving settings:', error);
                    alert('Ошибка при сохранении настроек');
                }
            });
        });
        
        // Завантажуємо налаштування при завантаженні сторінки
        loadSettings();
    </script>
{% endblock %}
